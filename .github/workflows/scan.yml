name: Scan

# Code scanning alerts are only shown for branches and pull requests. The release
# workflow runs on a tag, so its SARIF is accepted as an analysis but never turns
# into alerts - hence this separate workflow on main.
#
# The schedule matters as much as the push trigger: new CVEs appear in images that
# have not been rebuilt.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: debug-toolbox:scan

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: debug-toolbox:scan
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        # A pull request from a fork gets no security-events: write token.
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy table
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: debug-toolbox:scan
          format: table
          output: trivy-table.txt
          severity: CRITICAL,HIGH

      - name: Readable summary on the run page
        if: always()
        run: |
          {
            echo '### Trivy: CRITICAL and HIGH'
            echo ''
            echo '```'
            cat trivy-table.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
